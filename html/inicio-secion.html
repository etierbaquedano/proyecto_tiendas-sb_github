<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style-inicio-secion.css">
</head>
<body>
    <section class="formulario-inicio-secion" id="formulario-inicio-secion">
        <form action="#" method="post">
            <h2>Iniciar sesión</h2>

            <label for="usuario">Usuario o correo</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario o correo" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>

            <button type="submit">Entrar</button>

        </form>
    </section>
</body>
</html>
